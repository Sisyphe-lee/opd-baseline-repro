# Diagnostics exemption decided before launch: this is a faithful continuation of the frozen TCOD workflow, which has no token-level diagnostics instrumentation.
# Enabling the Adaptive workflow instrumentation would change the method. Entropy, KL, token-block, and realized-frontier figures are therefore unavailable for this TCOD extension.
# Resume from complete step250 to step310; keep workflow_args.total_steps=250 so post-step250 behavior remains full-horizon.
# Periodic checkpoints are step270 and step290; the final checkpoint is step310.
# Four-GPU TCOD reproduction: 1xTP1 student, 1xTP1 teacher, 2-GPU FSDP trainer.
# The two trainer GPUs shard model/optimizer state over NVLink. This avoids the
# single-GPU actor OOM without changing the global batch or TCOD algorithm.
# vLLM V0 is explicit because this Trinity revision's weight synchronizer runs
# in the outer Ray namespace; V1 starts an EngineCore in a nested namespace.

project: "ALFWORLD_TCOD_REPRO"
name: "tcod_f2b_extend_step250_to310_4gpu_s1t1_r4_seed42"
checkpoint_root_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/tcod_f2b_extend_step250_to310_4gpu_s1t1_r4/checkpoints
continue_from_checkpoint: true

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  loss_agg_mode: "seq-mean-token-mean"
  optimizer:
    lr: 1e-6

model:
  model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/models/Qwen2.5-3B-Instruct
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 4

buffer:
  total_steps: 310
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/tcod_official_alfworld/train_expert.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        total_steps: 250
        checkpoint_strategy: linear
        checkpoint_steps: 2
    eval_tasksets:
      - name: alfworld_eval_seen
        storage_type: file
        path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/tcod_official_alfworld/test.jsonl
        split: test
        total_steps: 10
        task_selector:
          selector_type: random
          seed: 42
        format:
          prompt_key: 'game_file'
        rollout_args:
          temperature: 0.4
          logprobs: 0
    default_workflow_type: 'TCOD_f2b_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_tcod_f2b_extend_step250_to310
      storage_type: queue
      path: 'sqlite:////vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/tcod_f2b_extend_step250_to310_4gpu_s1t1_r4/experience_buffer.db'

explorer:
  eval_interval: 20
  runner_per_model: 4
  max_timeout: 3600
  rollout_model:
    engine_num: 1
    tensor_parallel_size: 1
    use_v1: false
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    - model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/models/GiGPO-Qwen2.5-7B-Instruct-ALFWorld
      engine_num: 1
      tensor_parallel_size: 1
      use_v1: false
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      gpu_memory_utilization: 0.7
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp_tcod_extend310
    RAY_TMPDIR: /dev/shm/ray_tcod_extend310

synchronizer:
  sync_method: 'nccl'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  total_steps: 310
  save_interval: 20
  save_interval_offset: 250
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 1

monitor:
  monitor_type: wandb
