# Budget/control arm: identical full h=30 diagnostics, no loss-prefix filtering.
project: "ALFWORLD_ENTROPY_ADAPTIVE_V1"
name: "entropy_full_v1_qwen25_step10_fast_seed42"
checkpoint_root_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/entropy_full_v1_step10_fast/checkpoints
continue_from_checkpoint: false

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: multi_turn_opd
  repeat_times: 1
  advantage_fn_args:
    kl_coef: 1.0
  loss_agg_mode: "seq-mean-token-mean"
  optimizer:
    lr: 1e-6

model:
  model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/models/Qwen2.5-3B-Instruct
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 4

buffer:
  total_steps: 10
  batch_size: 16
  train_batch_size: 64
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/tcod_official_alfworld/train_expert.jsonl
      split: train
      format:
        prompt_key: 'game_file'
      rollout_args:
        temperature: 1.0
        logprobs: 16
      workflow_args:
        temperature: 1.0
        max_env_steps: 30
        diagnostics_enabled: true
        diagnostics_required: true
        diagnostics_top_k: 16
        diagnostics_teacher_concurrency: 4
        diagnostics_token_block_size: 32
        diagnostics_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/entropy_full_v1_step10_fast/diagnostics/trajectory_metrics.jsonl
        entropy_frontier_strategy: full
        entropy_frontier_threshold: 0.175
        entropy_frontier_baseline_turns: 3
        entropy_frontier_sustain_turns: 3
        entropy_frontier_min_retained_turns: 3
    default_workflow_type: 'OPD_entropy_mask_promptfix_alfworld_workflow'
  trainer_input:
    experience_buffer:
      name: alfworld_entropy_full_v1_step10_fast
      storage_type: queue
      path: 'sqlite:////vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/entropy_full_v1_step10_fast/experience_buffer.db'

explorer:
  eval_interval: 1000
  runner_per_model: 4
  max_timeout: 3600
  rollout_model:
    engine_num: 1
    tensor_parallel_size: 1
    use_v1: false
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    gpu_memory_utilization: 0.7
    enable_chunked_prefill: true
  auxiliary_models:
    - model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/models/GiGPO-Qwen2.5-7B-Instruct-ALFWorld
      engine_num: 1
      tensor_parallel_size: 1
      use_v1: false
      enable_prefix_caching: false
      enforce_eager: true
      dtype: bfloat16
      seed: 42
      gpu_memory_utilization: 0.7
      max_model_len: 20480
      max_prompt_tokens: 16384
      max_response_tokens: 512
  env_vars:
    TMPDIR: /dev/shm/tmp_entropy_full_v1_step10_fast
    RAY_TMPDIR: /dev/shm/ray_entropy_full_v1_step10_fast

synchronizer:
  sync_method: 'nccl'
  sync_style: 'dynamic_by_explorer'
  sync_interval: 1
  sync_timeout: 3600

trainer:
  total_steps: 10
  save_interval: 10
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 16384
  ulysses_sequence_parallel_size: 1

monitor:
  monitor_type: wandb
