        storage_type: file
        path: /home/sjx/workspaces/tcod-baseline/data/eval_manifests/full_valid_unseen.jsonl
        split: test
        format:
          prompt_key: game_file
        rollout_args: *sampling
        workflow_args:
          max_env_steps: 30
          accumulate_memory: true
          strict_action_parser: true
          result_dir: /home/sjx/workspaces/tcod-baseline/runs/experiments/warmup_boundary_full274/entropy_adaptive_v1_t0100/step_100_seed42/task_records
          evaluation_id: warmup_boundary_entropy_adaptive_v1_t0100_step100_full274_seed42
          checkpoint_label: warmup_boundary_entropy_adaptive_v1_t0100_step100
    default_workflow_type: TCOD_eval_alfworld_workflow

explorer:
