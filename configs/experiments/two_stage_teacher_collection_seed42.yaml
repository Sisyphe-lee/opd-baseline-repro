# One teacher rollout per train game. Only successful records enter offline SFT.
project: "ALFWORLD_TWO_STAGE_DISTILLATION"
group: "teacher-collection"
name: "gigpo7b_train3553_h30_seed42"
checkpoint_root_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/two_stage_distillation/teacher_collection/trinity_output
continue_from_checkpoint: false
mode: bench

algorithm:
  algorithm_type: grpo
  repeat_times: 1

model:
  model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/models/GiGPO-Qwen2.5-7B-Instruct-ALFWorld
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 8

buffer:
  batch_size: 8
  explorer_input:
    taskset:
      name: unused_train_set
      storage_type: file
      path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/tcod_official_alfworld/train_expert.jsonl
      split: train
      format:
        prompt_key: game_file
    eval_tasksets:
      - name: teacher_train3553_h30_seed42
        storage_type: file
        path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/tcod_official_alfworld/train_expert.jsonl
        split: test
        format:
          prompt_key: game_file
        rollout_args:
          temperature: 0.4
          top_p: 1.0
          top_k: -1
          max_tokens: 512
        workflow_args:
          max_env_steps: 30
          accumulate_memory: true
          strict_action_parser: true
          result_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/two_stage_distillation/teacher_collection/seed42/task_records
          evaluation_id: teacher_train3553_h30_promptfix_accmemory_strict_seed42
          checkpoint_label: gigpo_qwen25_7b_alfworld
    default_workflow_type: TCOD_eval_alfworld_workflow

explorer:
  eval_on_startup: true
  runner_per_model: 8
  max_timeout: 7200
  rollout_model:
    engine_num: 8
    tensor_parallel_size: 1
    use_v1: false
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.45
    dtype: bfloat16
    seed: 42
    enable_thinking: false
  auxiliary_models: []
  bench_on_latest_checkpoint: false

monitor:
  monitor_type: tensorboard

synchronizer:
  sync_method: checkpoint
  sync_style: fixed
  sync_interval: 1
  sync_timeout: 7200
