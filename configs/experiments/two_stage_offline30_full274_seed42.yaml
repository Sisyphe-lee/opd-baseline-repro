project: "ALFWORLD_TWO_STAGE_DISTILLATION"
group: "zero-diagnostic-full274"
name: "offline30_seed42"
checkpoint_root_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/two_stage_distillation/evaluation/offline30_seed42/trinity_output
continue_from_checkpoint: false
mode: bench

algorithm:
  algorithm_type: grpo
  repeat_times: 1

model:
  model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/two_stage_distillation/checkpoints/ALFWORLD_TWO_STAGE_DISTILLATION/zero-diagnostic/teacher_success_offline30_seed42/global_step_30/actor/huggingface
  max_prompt_tokens: 10240
  max_response_tokens: 512

cluster:
  node_num: 1
  gpu_per_node: 8

buffer:
  batch_size: 8
  explorer_input:
    taskset:
      name: unused_train_set
      storage_type: file
      path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/eval_manifests/full_valid_seen.jsonl
      split: train
      format:
        prompt_key: game_file
    eval_tasksets:
      - name: two_stage_offline30_seen
        storage_type: file
        path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/eval_manifests/full_valid_seen.jsonl
        split: test
        format:
          prompt_key: game_file
        rollout_args: &sampling
          temperature: 0.4
          top_p: 1.0
          top_k: -1
          max_tokens: 512
        workflow_args: &workflow
          max_env_steps: 30
          accumulate_memory: true
          strict_action_parser: true
          result_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/runs/experiments/two_stage_distillation/evaluation/offline30_seed42/task_records
          evaluation_id: offline30_full274_seed42
          checkpoint_label: teacher_success_offline30
      - name: two_stage_offline30_unseen
        storage_type: file
        path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/eval_manifests/full_valid_unseen.jsonl
        split: test
        format:
          prompt_key: game_file
        rollout_args: *sampling
        workflow_args: *workflow
    default_workflow_type: TCOD_eval_alfworld_workflow

explorer:
  eval_on_startup: true
  runner_per_model: 8
  max_timeout: 7200
  rollout_model:
    engine_num: 8
    tensor_parallel_size: 1
    use_v1: false
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.45
    dtype: bfloat16
    seed: 42
    enable_thinking: false
  auxiliary_models: []
  bench_on_latest_checkpoint: false

monitor:
  monitor_type: tensorboard

synchronizer:
  sync_method: checkpoint
  sync_style: fixed
  sync_interval: 1
  sync_timeout: 7200
