project: "TCOD-BASELINE-VALIDATION"
group: "live-smoke"
name: "tcod-step250-one-seen-task"
checkpoint_root_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/validation/live/tcod/trinity_output
continue_from_checkpoint: false
mode: bench
algorithm:
  algorithm_type: grpo
  repeat_times: 1
  optimizer: {lr: 1.0e-6}
model:
  model_path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/checkpoints/tcod_f2b_step250/global_step_250/actor/huggingface
  max_prompt_tokens: 10240
  max_response_tokens: 512
cluster: {node_num: 1, gpu_per_node: 1}
buffer:
  batch_size: 1
  explorer_input:
    taskset:
      name: unused_train_set
      storage_type: file
      path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/eval_manifests/live_smoke_seen_unseen.jsonl
      split: train
      format: {prompt_key: game_file}
    eval_tasksets:
      - name: tcod_step250_validation_seen
        storage_type: file
        path: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/data/eval_manifests/live_smoke_seen_unseen.jsonl
        split: test
        format: {prompt_key: game_file}
        rollout_args:
          temperature: 0.4
          top_p: 1.0
          top_k: -1
          max_tokens: 512
        workflow_args:
          max_env_steps: 30
          accumulate_memory: true
          strict_action_parser: true
          result_dir: /vepfs-mlp2/mlp-public/252302025/sjx/opd-workspaces/tcod-baseline/validation/live/tcod/task_records
          evaluation_id: baseline_live_smoke_tcod_step250_seed42
          checkpoint_label: tcod_f2b_step250
    default_workflow_type: TCOD_eval_alfworld_workflow
explorer:
  eval_on_startup: true
  runner_per_model: 1
  max_timeout: 3600
  rollout_model:
    engine_num: 1
    tensor_parallel_size: 1
    use_v1: false
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.45
    dtype: bfloat16
    seed: 42
    enable_thinking: false
  auxiliary_models: []
  bench_on_latest_checkpoint: false
monitor: {monitor_type: tensorboard}
synchronizer: {sync_method: checkpoint, sync_style: fixed, sync_interval: 1, sync_timeout: 3600}
